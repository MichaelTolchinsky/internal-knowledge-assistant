[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Internal Knowledge Assistant - a small RAG system for learning AI engineering concepts."
requires-python = ">=3.14"
readme = "README.md"

# Dependencies needed for this step: FastAPI app skeleton, SQLAlchemy 2.x + pgvector data
# model, Alembic migrations, settings. More are added as later implementation steps land
# (sentence-transformers, boto3/Bedrock, etc.).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.13",
    "pypdf>=5.1",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: deterministic, no external services",
    "integration: requires local Postgres/pgvector",
    "evaluation: runs the eval dataset against the real pipeline",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()-as-default-argument is the framework's documented DI pattern, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]
